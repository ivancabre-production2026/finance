# Tema "Finanzas Personales" — claro, paleta verde, sidebar verde oscuro
[theme]
base = "light"
primaryColor = "#0B5D3B"
backgroundColor = "#F6F7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12261B"
linkColor = "#0B5D3B"
borderColor = "#D5DDD0"
codeBackgroundColor = "#E9EFE7"
codeTextColor = "#12261B"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "10px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["38px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [800, 700, 700, 700, 600, 600]
linkUnderline = false

# Semántica: verde = ingreso/positivo, rojo = egreso/negativo, azul = pesos
greenColor = "#15803D"
greenBackgroundColor = "#DCFCE7"
greenTextColor = "#166534"
redColor = "#DC2626"
redBackgroundColor = "#FEE2E2"
redTextColor = "#991B1B"
yellowColor = "#D97706"
yellowBackgroundColor = "#FEF3C7"
yellowTextColor = "#92400E"
orangeColor = "#EA580C"
blueColor = "#1D4ED8"
blueBackgroundColor = "#DBEAFE"
blueTextColor = "#1E40AF"
violetColor = "#6D28D9"
grayColor = "#6B7280"

chartCategoricalColors = [
    "#0B5D3B",
    "#4CAF7A",
    "#2563EB",
    "#F59E0B",
    "#DC2626",
    "#7C3AED",
    "#0891B2",
    "#6B7280",
]

chartSequentialColors = [
    "#F0F7F1",
    "#DCEEDF",
    "#C4E3CA",
    "#A7D7B0",
    "#86C595",
    "#5FAF78",
    "#3F9660",
    "#277A4B",
    "#14603A",
    "#0A4A2C",
]

dataframeBorderColor = "#D5DDD0"
dataframeHeaderBackgroundColor = "#E9EFE7"

[theme.sidebar]
backgroundColor = "#0B3D2B"
secondaryBackgroundColor = "#14573F"
codeBackgroundColor = "#14573F"
textColor = "#E8F3EC"
linkColor = "#9FE3BC"
borderColor = "#1B5A43"
primaryColor = "#86EFAC"
